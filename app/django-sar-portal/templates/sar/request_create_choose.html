{% extends "base.html" %}
{% block title %}New request — SAR Portal{% endblock %}
{% block content %}
<div class="panel">
  <h1>Choose document type</h1>

    {% for value, label in choices %}

    {% endfor %}
  </ul>
</div>
{% endblock %}
